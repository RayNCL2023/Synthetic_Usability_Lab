# Local infrastructure only. web/api/worker run natively on the host so the
# browser dev loop keeps headless:false, the Playwright Inspector, and the
# trace viewer one flag away.
#
# `pnpm eval` is the exception — it runs inside the pinned Linux Playwright
# image (see docker/eval.Dockerfile) so golden numbers come from one rendering
# environment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sul
      POSTGRES_PASSWORD: sul
      POSTGRES_DB: sul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sul -d sul"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sulminio
      MINIO_ROOT_PASSWORD: sulminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the screenshots bucket on first boot, then exits.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sulminio sulminio123 &&
      mc mb --ignore-existing local/sul-screenshots &&
      echo 'bucket ready'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
